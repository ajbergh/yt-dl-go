version: 2
updates:
  - package-ecosystem: gomod
    directory: /src/server
    schedule:
      interval: weekly
    groups:
      chromedp:
        patterns:
          - "github.com/chromedp/*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # typescript-eslint 8 currently requires TypeScript <6.1. Remove this
    # restriction when the lint stack supports the TypeScript 7 compiler API.
    ignore:
      - dependency-name: typescript
        versions: [">=7.0.0"]
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      eslint:
        patterns:
          - "typescript"
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "eslint-plugin-*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
  - package-ecosystem: npm
    directory: /tools/license-checker
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
