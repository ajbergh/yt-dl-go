name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version to validate (for example, v0.1.0)
        required: true
        default: v0.1.0
        type: string

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate release version and package version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_VERSION}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use stable semantic version format vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          package_version="$(node -e 'const fs=require("fs"); console.log(JSON.parse(fs.readFileSync("package.json","utf8")).version)')"
          expected_tag="v${package_version}"
          if [[ "${RELEASE_VERSION}" != "${expected_tag}" ]]; then
            echo "Release version ${RELEASE_VERSION} does not match package.json version ${expected_tag}." >&2
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.1
        with:
          go-version-file: src/server/go.mod
          cache-dependency-path: src/server/go.sum

      - name: Install frontend dependencies
        run: npm ci

      - name: Install license scanner tools
        run: |
          npm ci --prefix tools/license-checker
          go install github.com/google/go-licenses/v2@v2.0.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify third-party notices and licenses
        run: npm run licenses:check

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build embedded frontend
        run: npm run build -- --outDir src/server/dist

      - name: Run frontend integration tests
        run: bun test src/downloader.test.mjs src/ui.test.mjs

      - name: Run Go tests and vet
        working-directory: src/server
        run: |
          go test ./...
          go vet ./...

      - name: Run browser end-to-end tests
        run: npm run e2e:browser

  windows:
    name: Windows release package
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.1
        with:
          go-version-file: src/server/go.mod
          cache-dependency-path: src/server/go.sum

      - name: Install frontend dependencies
        run: npm ci

      - name: Set release metadata
        shell: pwsh
        run: |
          "VERSION=${{ env.RELEASE_VERSION }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "COMMIT=${{ github.sha }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $commitDate = [DateTimeOffset]::Parse((git show -s --format=%cI "${{ github.sha }}").Trim()).ToUniversalTime()
          $buildDate = $commitDate.ToString("yyyy-MM-dd'T'HH:mm:ss'Z'")
          "BUILD_DATE=$buildDate" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Windows executable
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: ./scripts/build-windows.ps1 -OutputPath dist/release/youtube-downloader.exe

      - name: Detect Windows architecture
        id: platform
        shell: pwsh
        run: '"arch=${{ matrix.arch }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8'

      - name: Package Windows executable
        shell: pwsh
        run: ./scripts/package-windows.ps1 -ExecutablePath dist/release/youtube-downloader.exe -Architecture "${{ steps.platform.outputs.arch }}" -ArchivePath "dist/release/youtube-downloader-windows-${{ steps.platform.outputs.arch }}.zip"

      - name: Attest Windows release package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/youtube-downloader-windows-${{ steps.platform.outputs.arch }}.zip

      - name: Record expected archive
        shell: pwsh
        run: '"youtube-downloader-windows-${{ steps.platform.outputs.arch }}.zip" | Set-Content -Path "dist/release/expected-windows-${{ steps.platform.outputs.arch }}.txt" -Encoding ascii'

      - name: Upload Windows release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-${{ steps.platform.outputs.arch }}
          path: |
            dist/release/youtube-downloader-windows-${{ steps.platform.outputs.arch }}.zip
            dist/release/youtube-downloader-windows-${{ steps.platform.outputs.arch }}.zip.sha256
            dist/release/expected-windows-${{ steps.platform.outputs.arch }}.txt
          if-no-files-found: error
          retention-days: 7

  unix:
    name: ${{ matrix.label }} release package
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux
            arch: amd64
            label: Linux amd64
          - runner: ubuntu-latest
            target: linux
            arch: arm64
            label: Linux arm64
          - runner: macos-latest
            target: darwin
            arch: amd64
            label: macOS amd64
          - runner: macos-latest
            target: darwin
            arch: arm64
            label: macOS arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.1
        with:
          go-version-file: src/server/go.mod
          cache-dependency-path: src/server/go.sum

      - name: Install frontend dependencies
        run: npm ci

      - name: Set release metadata
        shell: bash
        run: |
          echo "VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"
          echo "COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
          commit_date="$(git show -s --format=%cI "${GITHUB_SHA}")"
          build_date="$(node -e 'const date = new Date(process.argv[1]); if (Number.isNaN(date.getTime())) process.exit(1); console.log(date.toISOString().replace(/\.\d{3}Z$/, "Z"))' "$commit_date")"
          echo "BUILD_DATE=$build_date" >> "$GITHUB_ENV"

      - name: Build and package ${{ matrix.label }}
        shell: bash
        env:
          TARGET_OS: ${{ matrix.target }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: bash ./scripts/build-unix.sh "dist/release/youtube-downloader-${{ matrix.target }}-${{ matrix.arch }}"

      - name: Attest ${{ matrix.label }} release package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/youtube-downloader-${{ matrix.target }}-${{ matrix.arch }}.tar.gz

      - name: Record expected archive
        shell: bash
        run: echo "youtube-downloader-${{ matrix.target }}-${{ matrix.arch }}.tar.gz" > "dist/release/expected-${{ matrix.target }}-${{ matrix.arch }}.txt"

      - name: Upload ${{ matrix.label }} release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist/release/youtube-downloader-${{ matrix.target }}-${{ matrix.arch }}.tar.gz
            dist/release/youtube-downloader-${{ matrix.target }}-${{ matrix.arch }}.tar.gz.sha256
            dist/release/expected-${{ matrix.target }}-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Prepare draft GitHub Release
    needs:
      - windows
      - unix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true

      - name: Create LGPL source and relinking archive
        shell: bash
        run: |
          source_archive="yt-dl-go-source-${RELEASE_VERSION}.tar.gz"
          git archive --format=tar --prefix="yt-dl-go-${RELEASE_VERSION}/" "${GITHUB_SHA}" | gzip -n > "dist/release/${source_archive}"
          sha256sum "dist/release/${source_archive}" > "dist/release/${source_archive}.sha256"
          printf '%s\n' "${source_archive}" > dist/release/expected-source.txt

      - name: Verify checksums and create manifest
        shell: bash
        run: |
          cd dist/release
          for checksum in *.sha256; do
            sha256sum -c "$checksum"
          done
          expected_count="$(cat expected-*.txt | wc -l)"
          actual_count="$(find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l)"
          if [[ "$expected_count" -eq 0 || "$actual_count" -ne "$expected_count" ]]; then
            echo "Expected $expected_count release archives from build matrix, found $actual_count." >&2
            exit 1
          fi
          while IFS= read -r archive; do
            test -f "$archive"
          done < <(cat expected-*.txt)
          sha256sum *.zip *.tar.gz | sort > SHA256SUMS.txt

      - name: Attest release checksum manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/SHA256SUMS.txt

      - name: Upload dry-run release artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dry-run-${{ env.RELEASE_VERSION }}
          path: |
            dist/release/*.zip
            dist/release/*.tar.gz
            dist/release/*.sha256
            dist/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Create draft GitHub Release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${RELEASE_VERSION}" \
            --verify-tag \
            --draft \
            --title "${RELEASE_VERSION}" \
            --generate-notes \
            dist/release/*.zip \
            dist/release/*.tar.gz \
            dist/release/*.sha256 \
            dist/release/SHA256SUMS.txt
