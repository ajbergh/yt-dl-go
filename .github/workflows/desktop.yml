name: Desktop builds

on:
  workflow_dispatch:
  push:
    branches: [main, "desktop/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Wails ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows/amd64
            runner: windows-latest
          - target: windows/arm64
            runner: windows-11-arm
          - target: linux/amd64
            runner: ubuntu-24.04
          - target: linux/arm64
            runner: ubuntu-24.04-arm
          - target: darwin/amd64
            runner: macos-15-intel
          - target: darwin/arm64
            runner: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.1
        with:
          go-version-file: src/server/go.mod
          cache-dependency-path: src/server/go.sum
      - name: Install Linux WebKit build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev xvfb dbus-x11
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check frontend
        run: npm run typecheck
      - name: Build embedded interface for tests
        run: npm run build -- --outDir src/server/dist
      - name: Test desktop service and native save handling
        working-directory: src/server
        shell: bash
        run: |
          tags=desktop
          if [[ "$RUNNER_OS" == Linux ]]; then tags=desktop,webkit2_41; fi
          go test -tags "$tags" ./...
          go vet -tags "$tags" ./...
      - name: Build and package desktop application
        run: npm run build:desktop -- ${{ matrix.target }}
        env:
          COMMIT: ${{ github.sha }}
      - name: Smoke-test native desktop window
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Smoke-test Linux desktop window under Xvfb
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a npm run test:desktop
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
      - name: Upload desktop packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/desktop/**/*.zip
            dist/desktop/**/*.tar.gz
            dist/desktop/**/*.sha256
          if-no-files-found: error
          retention-days: 14
