name: CI

on:
  push:
    branches:
      - main
      - "roadmap/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: src/server/go.sum

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Check production bundle for preview-host code
        run: npm run build:check

      - name: Build embedded frontend
        run: npm run build -- --outDir src/server/dist

      - name: Run frontend integration tests
        run: bun test src/downloader.test.mjs src/ui.test.mjs

      - name: Run Go tests
        working-directory: src/server
        run: go test ./...

      - name: Check development origin policy
        working-directory: src/server
        run: go test -tags=dev -run TestDevelopmentOriginsIncludeVite ./...

      - name: Run Go vet
        working-directory: src/server
        run: go vet ./...

      - name: Run browser end-to-end tests
        run: npm run e2e:browser

  windows-build:
    name: Windows production build
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: src/server/go.sum

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and test Windows executable
        shell: pwsh
        run: ./scripts/build-windows.ps1 -OutputPath dist/ci/youtube-downloader.exe

      - name: Detect Windows architecture
        id: windows-platform
        shell: pwsh
        run: '"arch=$(go env GOARCH)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8'

      - name: Package Windows executable
        shell: pwsh
        run: ./scripts/package-windows.ps1 -ExecutablePath dist/ci/youtube-downloader.exe -Architecture "${{ steps.windows-platform.outputs.arch }}" -ArchivePath "dist/ci/youtube-downloader-windows-${{ steps.windows-platform.outputs.arch }}.zip"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: youtube-downloader-windows-${{ steps.windows-platform.outputs.arch }}
          path: |
            dist/ci/youtube-downloader.exe
            dist/ci/youtube-downloader-windows-${{ steps.windows-platform.outputs.arch }}.zip
            dist/ci/youtube-downloader-windows-${{ steps.windows-platform.outputs.arch }}.zip.sha256
          if-no-files-found: error
          retention-days: 7

  unix-build:
    name: ${{ matrix.label }} production package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux
            arch: amd64
            label: Linux amd64
          - runner: ubuntu-latest
            target: linux
            arch: arm64
            label: Linux arm64
          - runner: macos-latest
            target: darwin
            arch: amd64
            label: macOS amd64
          - runner: macos-latest
            target: darwin
            arch: arm64
            label: macOS arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: src/server/go.sum

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and package ${{ matrix.label }}
        shell: bash
        env:
          TARGET_OS: ${{ matrix.target }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: bash ./scripts/build-unix.sh "dist/ci/youtube-downloader-${{ matrix.target }}-${{ matrix.arch }}"

      - name: Upload ${{ matrix.label }} package
        uses: actions/upload-artifact@v4
        with:
          name: youtube-downloader-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist/ci/youtube-downloader-${{ matrix.target }}-${{ matrix.arch }}.tar.gz
            dist/ci/youtube-downloader-${{ matrix.target }}-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
