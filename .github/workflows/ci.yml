name: CI

on:
  push:
    branches:
      - main
      - "roadmap/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source and tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.1
        with:
          go-version-file: src/server/go.mod
          cache-dependency-path: src/server/go.sum

      - name: Install Go analysis tools
        shell: bash
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install license scanner tools
        run: |
          npm ci --prefix tools/license-checker
          go install github.com/google/go-licenses/v2@v2.0.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify third-party notices and licenses
        run: npm run licenses:check

      - name: Type-check frontend
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Check production bundle for preview-host code
        run: npm run build:check

      - name: Build embedded frontend
        run: npm run build -- --outDir src/server/dist

      - name: Run frontend integration tests
        run: bun test src/downloader.test.mjs src/ui.test.mjs

      - name: Run Go tests
        working-directory: src/server
        run: go test ./...

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(find src/server -maxdepth 1 -type f -name '*.go' -print0 | xargs -0 gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Run Go race tests
        working-directory: src/server
        run: go test -race ./...

      - name: Run golangci-lint
        working-directory: src/server
        run: golangci-lint run

      - name: Scan Go dependencies and source for vulnerabilities
        working-directory: src/server
        run: govulncheck ./...

      - name: Check development origin policy
        working-directory: src/server
        run: go test -tags=dev -run TestDevelopmentOriginsIncludeVite ./...

      - name: Run Go vet
        working-directory: src/server
        run: go vet ./...

      - name: Run Go vet with E2E build tag
        working-directory: src/server
        run: go vet -tags=e2e ./...

      - name: Run browser end-to-end tests
        run: npm run e2e:browser

  windows-build:
    name: Windows production build
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.1
        with:
          go-version-file: src/server/go.mod
          cache-dependency-path: src/server/go.sum

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and test Windows executable
        shell: pwsh
        run: ./scripts/build-windows.ps1 -OutputPath dist/ci/youtube-downloader.exe

      - name: Detect Windows architecture
        id: windows-platform
        shell: pwsh
        run: '"arch=$(go env GOARCH)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8'

      - name: Package Windows executable
        shell: pwsh
        run: ./scripts/package-windows.ps1 -ExecutablePath dist/ci/youtube-downloader.exe -Architecture "${{ steps.windows-platform.outputs.arch }}" -ArchivePath "dist/ci/youtube-downloader-windows-${{ steps.windows-platform.outputs.arch }}.zip"

      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: youtube-downloader-windows-${{ steps.windows-platform.outputs.arch }}
          path: |
            dist/ci/youtube-downloader.exe
            dist/ci/youtube-downloader-windows-${{ steps.windows-platform.outputs.arch }}.zip
            dist/ci/youtube-downloader-windows-${{ steps.windows-platform.outputs.arch }}.zip.sha256
          if-no-files-found: error
          retention-days: 7

  unix-build:
    name: ${{ matrix.label }} production package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux
            arch: amd64
            label: Linux amd64
          - runner: ubuntu-latest
            target: linux
            arch: arm64
            label: Linux arm64
          - runner: macos-latest
            target: darwin
            arch: amd64
            label: macOS amd64
          - runner: macos-latest
            target: darwin
            arch: arm64
            label: macOS arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.1
        with:
          go-version-file: src/server/go.mod
          cache-dependency-path: src/server/go.sum

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and package ${{ matrix.label }}
        shell: bash
        env:
          TARGET_OS: ${{ matrix.target }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: bash ./scripts/build-unix.sh "dist/ci/youtube-downloader-${{ matrix.target }}-${{ matrix.arch }}"

      - name: Upload ${{ matrix.label }} package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: youtube-downloader-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist/ci/youtube-downloader-${{ matrix.target }}-${{ matrix.arch }}.tar.gz
            dist/ci/youtube-downloader-${{ matrix.target }}-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
