<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">YouTube Downloader project banner</title>
  <desc id="desc">A warm dark banner for the local-first YouTube Downloader project, showing a stylized download interface, queue progress, and cross-platform capabilities.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17130f"/>
      <stop offset="0.52" stop-color="#201914"/>
      <stop offset="1" stop-color="#2a2018"/>
    </linearGradient>
    <linearGradient id="panel" x1="955" y1="70" x2="1460" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#30261f"/>
      <stop offset="1" stop-color="#211a15"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset="0.5" stop-color="#e9a957"/>
      <stop offset="1" stop-color="#c77a2c"/>
    </linearGradient>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset="1" stop-color="#d98d38"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1190 245) rotate(90) scale(310 430)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d98d38" stop-opacity=".20"/>
      <stop offset="1" stop-color="#d98d38" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#fff7e8" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="windowClip">
      <rect x="940" y="70" width="520" height="380" rx="28"/>
    </clipPath>
  </defs>

  <rect width="1600" height="520" rx="30" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="30" fill="url(#grid)"/>
  <ellipse cx="1190" cy="245" rx="440" ry="330" fill="url(#glow)"/>

  <g opacity=".85">
    <circle cx="82" cy="72" r="5" fill="#f5d49b"/>
    <circle cx="108" cy="72" r="5" fill="#8e7159"/>
    <circle cx="134" cy="72" r="5" fill="#8e7159"/>
  </g>

  <g transform="translate(86 102)">
    <rect width="226" height="36" rx="18" fill="#2d251f" stroke="#695443"/>
    <circle cx="20" cy="18" r="5" fill="#efb15f"/>
    <text x="35" y="23" fill="#d7c8b8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="650" letter-spacing="1.4">LOCAL • PRIVATE • FAST</text>

    <text x="0" y="102" fill="#fff9ef" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="61" font-weight="760" letter-spacing="-2.2">YouTube Downloader</text>
    <text x="1" y="148" fill="#cdbdab" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="430">
      One Go binary. Embedded React UI. Native download engine.
    </text>

    <g transform="translate(0 193)">
      <rect width="146" height="42" rx="21" fill="#2c241e" stroke="#5c493a"/>
      <text x="73" y="27" text-anchor="middle" fill="#f0dfca" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">2160p / WebM</text>

      <rect x="158" width="108" height="42" rx="21" fill="#2c241e" stroke="#5c493a"/>
      <text x="212" y="27" text-anchor="middle" fill="#f0dfca" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Playlists</text>

      <rect x="278" width="106" height="42" rx="21" fill="#2c241e" stroke="#5c493a"/>
      <text x="331" y="27" text-anchor="middle" fill="#f0dfca" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Captions</text>

      <rect x="396" width="242" height="42" rx="21" fill="#2c241e" stroke="#5c493a"/>
      <text x="517" y="27" text-anchor="middle" fill="#f0dfca" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Windows · macOS · Linux</text>
    </g>

    <g transform="translate(0 283)">
      <g>
        <rect width="52" height="52" rx="16" fill="url(#accent)"/>
        <path d="M26 12v19m0 0-8-8m8 8 8-8M15 39h22" fill="none" stroke="#2a1e14" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="68" y="21" fill="#f5eadc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Local-first by design</text>
      <text x="68" y="44" fill="#a99785" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Queue, inspect, download, organize — all from your own machine.</text>
    </g>
  </g>

  <g>
    <rect x="940" y="70" width="520" height="380" rx="28" fill="url(#panel)" stroke="#66503e" stroke-width="1.5"/>
    <g clip-path="url(#windowClip)">
      <rect x="940" y="70" width="520" height="58" fill="#342921"/>
      <circle cx="976" cy="99" r="6" fill="#d88d47"/>
      <circle cx="998" cy="99" r="6" fill="#725c4a"/>
      <circle cx="1020" cy="99" r="6" fill="#725c4a"/>
      <rect x="1060" y="85" width="360" height="28" rx="14" fill="#211a15" stroke="#4a3a2e"/>
      <text x="1080" y="104" fill="#8f7e6d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">127.0.0.1:8080</text>

      <rect x="971" y="153" width="458" height="60" rx="16" fill="#1d1713" stroke="#5a4636"/>
      <circle cx="999" cy="183" r="11" fill="#30241b" stroke="#a27546"/>
      <path d="M995 178l9 5-9 5z" fill="#efb15f"/>
      <text x="1020" y="178" fill="#f5eadc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650">Paste a YouTube video or playlist URL</text>
      <text x="1020" y="197" fill="#897868" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">Inspect supported formats before downloading</text>
      <rect x="1335" y="166" width="76" height="34" rx="12" fill="url(#accent)"/>
      <text x="1373" y="188" text-anchor="middle" fill="#2a1e14" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="760">Inspect</text>

      <text x="972" y="248" fill="#b9a895" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="720" letter-spacing="1.3">DOWNLOAD QUEUE</text>
      <text x="1388" y="248" text-anchor="end" fill="#8a7766" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">3 items</text>

      <g transform="translate(971 265)">
        <rect width="458" height="68" rx="16" fill="#2b211a" stroke="#4f3e31"/>
        <rect x="14" y="14" width="48" height="40" rx="10" fill="#3b2b20"/>
        <path d="M32 23l16 11-16 11z" fill="#e8aa58"/>
        <text x="77" y="26" fill="#f5eadc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650">Architecture Walkthrough — 2160p</text>
        <text x="77" y="44" fill="#8f7d6d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">VP9 + Opus · WebM</text>
        <rect x="77" y="53" width="330" height="5" rx="2.5" fill="#45372c"/>
        <rect x="77" y="53" width="254" height="5" rx="2.5" fill="url(#progress)"/>
        <text x="430" y="43" text-anchor="end" fill="#f0c786" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700">77%</text>
      </g>

      <g transform="translate(971 344)">
        <rect width="222" height="70" rx="16" fill="#251d18" stroke="#49382c"/>
        <circle cx="28" cy="25" r="11" fill="#2f261f" stroke="#5c493a"/>
        <path d="M24 25h8M28 21v8" stroke="#d6ad77" stroke-width="2" stroke-linecap="round"/>
        <text x="47" y="29" fill="#eadcca" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="650">Caption sidecar</text>
        <text x="16" y="54" fill="#887566" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">English · SRT</text>
      </g>

      <g transform="translate(1207 344)">
        <rect width="222" height="70" rx="16" fill="#251d18" stroke="#49382c"/>
        <circle cx="28" cy="25" r="11" fill="#2f261f" stroke="#5c493a"/>
        <path d="M23 25h10M28 20v10" stroke="#d6ad77" stroke-width="2" stroke-linecap="round"/>
        <text x="47" y="29" fill="#eadcca" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="650">Playlist batch</text>
        <text x="16" y="54" fill="#887566" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">Queue · Pause · Resume</text>
      </g>
    </g>

    <g transform="translate(1416 50)">
      <circle r="43" fill="#2b2119" stroke="#76583b" stroke-width="1.5"/>
      <circle r="32" fill="url(#accent)"/>
      <path d="M0-14V9m0 0-10-10M0 9 10-1M-14 17h28" fill="none" stroke="#281d14" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <path d="M760 92c49 37 74 76 74 117 0 52-38 81-81 117" fill="none" stroke="#d69a52" stroke-opacity=".12" stroke-width="2" stroke-dasharray="7 9"/>
  <circle cx="760" cy="92" r="4" fill="#d69a52" fill-opacity=".45"/>
  <circle cx="753" cy="326" r="4" fill="#d69a52" fill-opacity=".45"/>

  <text x="1515" y="492" text-anchor="end" fill="#755f4c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="1.2">GO • REACT • SQLITE • CGO-FREE</text>
</svg>